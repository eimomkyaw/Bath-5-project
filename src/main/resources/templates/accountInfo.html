<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout/masterLayout :: layout(~{:: main})"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
<main role="main">
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h3>Account Information</h3>
            <h4>Logged User :: <span sec:authentication="name"></span></h4>
            <h2>Roles</h2>
            <ul class="list-group" th:each="role : ${#authentication.authorities}">
                <li class="list-group-item" th:text="${role}"></li>
            </ul>
        </div>
    </div>

    <div class="container my-3">
        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-header">
                        <div class="h3">Your Library</div>
                    </div>

                    <table class="table table-striped">
                        <thead class="thead-dark">
                        <tr>
                            <th>Id</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>

                        </tr>
                        <tbody>
                        <tr th:each="item :${items}">
                            <td th:text="${item.id}"></td>
                            <td th:text="${item.title}"></td>
                            <td th:text="${item.author}"></td>
                            <td th:text="${item.price}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="${item.sum}"></td>
                        </tr>
                        </tbody>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
